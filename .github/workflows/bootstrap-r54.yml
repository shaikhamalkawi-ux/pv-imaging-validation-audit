name: Publish verified R54 public source tree
on:
  push:
    paths:
      - "release-payload/R54_public_source.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-extract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256, all archived paths, and manifest before extraction
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile,hashlib,json,stat
          archive=Path("release-payload/R54_public_source.zip")
          expected="b8bbf4bfd4a6c0317dfdcaee623cbad117f4b88f453415b03ae8aa609d0d94e8"
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected, "ZIP digest mismatch"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "ZIP CRC failed"
              members=z.infolist()
              assert len(members)==65, "Unexpected member count"
              prefix="pv-imaging-validation-audit/"
              payload={}
              for i in members:
                  assert i.filename.startswith(prefix) and not i.is_dir()
                  p=PurePosixPath(i.filename[len(prefix):])
                  assert p.parts and all(x not in ('','.','..') for x in p.parts)
                  assert (i.external_attr>>16)&0o170000!=0o120000, "Symlink refused"
                  assert str(p) not in payload, "Duplicate path refused"
                  payload[str(p)]=z.read(i)
              manifest=json.loads(payload["MANIFEST_SHA256.json"].decode("utf-8"))
              index=manifest["files"]
              assert len(index)==64 and set(index)==set(payload)-{"MANIFEST_SHA256.json"}
              for name,rec in index.items():
                  b=payload[name]
                  assert len(b)==rec["bytes"] and hashlib.sha256(b).hexdigest()==rec["sha256"],name
              for name,b in payload.items():
                  target=Path(name)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(b)
          print("PASS: 65 verified files, ZIP checksum, CRC, path safety and SHA-256 manifest")
          PY
      - name: Run source-bound public reproducibility self-tests
        run: |
          python tests/verify_public.py
          python cases/benchmarkel_r50b/benchmarkel_git_tree_audit.py --selftest
          python cases/sandia_r50/test_certificates.py
      - name: Commit verified source files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish 65 audited R54 files from source-locked archive"
          git push origin HEAD:main
